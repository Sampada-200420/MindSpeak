
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindSpeak — Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #F1EAD8 0%, #BEC5A4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-box {
            background: white;
            border-radius: 24px;
            padding: 50px 45px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(104,96,77,0.2);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-area img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .logo-area .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 700;
            color: #3a4a2e;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 700;
            color: #3a3a2e;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 13px;
            color: #8A8E75;
            text-align: center;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #68604D;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid #e8e0d0;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            color: #3a3a2e;
            background: #F1EAD8;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #8A8E75;
            background: white;
            box-shadow: 0 0 0 3px rgba(138,142,117,0.1);
        }

        .form-group input::placeholder {
            color: #b5a990;
            font-size: 13px;
        }

        .token-display {
            background: #F1EAD8;
            border: 2px dashed #BEC5A4;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 11px;
            color: #68604D;
            margin-bottom: 18px;
            word-break: break-all;
        }

        .token-display strong {
            display: block;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            color: #8A8E75;
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #8A8E75, #5a6b4a);
            color: white;
            border: none;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(90,107,74,0.35);
        }

        .btn-main:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .auth-footer {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: #8A8E75;
        }

        .auth-footer a {
            color: #5a6b4a;
            font-weight: 600;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .message-box {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 18px;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        .message-box.error {
            background: #fde8e8;
            color: #c0392b;
            border: 1px solid #f5c6c6;
            display: block;
        }

        .message-box.success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
            display: block;
        }

        .success-state {
            display: none;
            text-align: center;
        }

        .success-state.show { display: block; }

        .success-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .success-state h3 {
            font-family: 'Playfair Display', serif;
            font-size: 19px;
            color: #3a4a2e;
            margin-bottom: 10px;
        }

        .success-state p {
            font-size: 13px;
            color: #8A8E75;
            line-height: 1.7;
        }
    </style>
</head>
<body>

<div class="auth-box">

    <div class="logo-area">
        <img src="/frontend/images/mindspeak.jpg" alt="MindSpeak">
        <div class="logo-text">MindSpeak</div>
    </div>

    <div class="message-box" id="messageBox"></div>

    <!-- Reset Form -->
    <div id="resetForm">
        <h2>Reset Your Password</h2>
        <p class="subtitle">Create a new password for your account.</p>

        

        <div class="form-group">
            <label>New Password</label>
            <input type="password" id="newPassword" placeholder="Enter new password">
        </div>

        <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" id="confirmPassword" placeholder="Repeat new password">
        </div>

        <button class="btn-main" onclick="resetPassword()" id="resetBtn">
            Reset Password
        </button>

        <div class="auth-footer">
            Remember your password? <a href="login.html">Log In</a>
        </div>
    </div>

    <!-- Success State -->
    <div class="success-state" id="successState">
        <div class="success-icon">✅</div>
        <h3>Password Reset!</h3>
        <p>Your password has been changed successfully.<br>Redirecting to login...</p>
    </div>

</div>

<script>
    const API = "http://127.0.0.1:8000";

    // Get token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get("token") || "";

    

    function showMessage(msg, type) {
        const box = document.getElementById("messageBox");
        box.textContent = msg;
        box.className = `message-box ${type}`;
    }

    async function resetPassword() {
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (!token) {
            showMessage("No reset token found. Please use the link from forgot password.", "error");
            return;
        }

        if (!newPassword || !confirmPassword) {
            showMessage("Please fill in both password fields.", "error");
            return;
        }

        if (newPassword !== confirmPassword) {
            showMessage("Passwords do not match.", "error");
            return;
        }

        if (newPassword.length < 6) {
            showMessage("Password must be at least 6 characters.", "error");
            return;
        }

        const btn = document.getElementById("resetBtn");
        btn.disabled = true;
        btn.textContent = "Resetting...";

        try {
            const res = await fetch(`${API}/auth/reset-password`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token, new_password: newPassword })
            });

            const data = await res.json();

            if (data.error) {
                showMessage(data.error, "error");
                btn.disabled = false;
                btn.textContent = "Reset Password";
                return;
            }

            // Show success
            document.getElementById("resetForm").style.display = "none";
            document.getElementById("messageBox").style.display = "none";
            document.getElementById("successState").classList.add("show");

            setTimeout(() => {
                window.location.href = "login.html";
            }, 2000);

        } catch (err) {
            showMessage("Cannot connect to server. Is uvicorn running?", "error");
            btn.disabled = false;
            btn.textContent = "Reset Password";
        }
    }
</script>

</body>
</html>
