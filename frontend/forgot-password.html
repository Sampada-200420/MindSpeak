
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindSpeak — Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #F1EAD8 0%, #BEC5A4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-box {
            background: white;
            border-radius: 24px;
            padding: 50px 45px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(104,96,77,0.2);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-area img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .logo-area .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 700;
            color: #3a4a2e;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 700;
            color: #3a3a2e;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 13px;
            color: #8A8E75;
            text-align: center;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #68604D;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid #e8e0d0;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            color: #3a3a2e;
            background: #F1EAD8;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #8A8E75;
            background: white;
            box-shadow: 0 0 0 3px rgba(138,142,117,0.1);
        }

        .form-group input::placeholder {
            color: #b5a990;
            font-size: 13px;
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #8A8E75, #5a6b4a);
            color: white;
            border: none;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(90,107,74,0.35);
        }

        .btn-main:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .auth-footer {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: #8A8E75;
        }

        .auth-footer a {
            color: #5a6b4a;
            font-weight: 600;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .message-box {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 18px;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        .message-box.error {
            background: #fde8e8;
            color: #c0392b;
            border: 1px solid #f5c6c6;
            display: block;
        }

        .success-state {
            display: none;
            text-align: center;
        }

        .success-state.show { display: block; }

        .success-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .success-state h3 {
            font-family: 'Playfair Display', serif;
            font-size: 19px;
            color: #3a4a2e;
            margin-bottom: 10px;
        }

        .success-state p {
            font-size: 13px;
            color: #8A8E75;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .test-note {
            background: #f9f5e8;
            border: 1px solid #e0d5b0;
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 12px;
            color: #7a6500;
            margin: 15px 0;
            line-height: 1.6;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="auth-box">

    <div class="logo-area">
        <img src="/frontend/images/mindspeak.jpg" alt="MindSpeak">
        <div class="logo-text">MindSpeak</div>
    </div>

    <div class="message-box" id="messageBox"></div>

    <div id="forgotForm">
        <h2>Forgot Password?</h2>
        <p class="subtitle">No worries. Enter your email and we'll send you a reset link.</p>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your registered email">
        </div>

        <button class="btn-main" onclick="forgotPassword()" id="forgotBtn">
            Send Reset Link
        </button>

        <div class="auth-footer">
            Remember your password? <a href="login.html">Log In</a>
        </div>
    </div>

    <div class="success-state" id="successState">
        <div class="success-icon">📧</div>
        <h3>Check Your Email</h3>
        <p>If an account exists with that email, a password reset link has been sent.</p>

        <div class="test-note">
            <strong>For testing:</strong> Click below to go to reset page directly.
        </div>

        <button class="btn-main" id="goResetBtn" onclick="goToReset()">
            Continue to Reset Password
        </button>
    </div>

</div>

<script>
    const API = "http://127.0.0.1:8000";
    let resetToken = "";

    function showMessage(msg, type) {
        const box = document.getElementById("messageBox");
        box.textContent = msg;
        box.className = `message-box ${type}`;
    }

    async function forgotPassword() {
        const email = document.getElementById("email").value.trim();

        if (!email) {
            showMessage("Please enter your email.", "error");
            return;
        }

        const btn = document.getElementById("forgotBtn");
        btn.disabled = true;
        btn.textContent = "Sending...";

        try {
            const res = await fetch(`${API}/auth/forgot-password`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email })
            });

            const data = await res.json();
            resetToken = data.reset_token || "";

            document.getElementById("forgotForm").style.display = "none";
            document.getElementById("messageBox").style.display = "none";
            document.getElementById("successState").classList.add("show");

        } catch (err) {
            showMessage("Cannot connect to server. Is uvicorn running?", "error");
            btn.disabled = false;
            btn.textContent = "Send Reset Link";
        }
    }

    function goToReset() {
        if (resetToken) {
            window.location.href = `reset-password.html?token=${resetToken}`;
        } else {
            window.location.href = `reset-password.html`;
        }
    }
</script>

</body>
</html>
